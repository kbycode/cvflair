name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # opencv-python wheel'i libGL ve glib'e dinamik bağlı; runner imajında yok.
      # Paket adı Ubuntu 24.04'te t64 geçişiyle değiştiği için iki ad da deneniyor.
      - name: OpenCV sistem kütüphaneleri
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y libgl1 libglib2.0-0

      - name: Kurulum
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Paket py.typed gönderiyor; tip iddiasını denetlemeden bırakmıyoruz.
      - name: Tip denetimi
        run: mypy

      - name: Test
        run: pytest -q

  package:
    name: paket doğrulama
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Kurulum
        run: pip install build twine

      - name: Derle
        run: python -m build

      - name: Metadata denetimi
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
