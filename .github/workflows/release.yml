name: Yayın

# Sürüm etiketi push edilince paket derlenir ve PyPI'a yüklenir:
#   git tag -a v0.8.0 -m "..." && git push origin v0.8.0
# Yükleme, `pypi` environment'ındaki onay kuralı nedeniyle bekler; Actions'tan
# onaylanınca tamamlanır. Elle tetikleme (Run workflow) da açık: zaten yayınlanmış
# bir sürüm `skip-existing` ile atlandığı için kurulumu denemek zararsız.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: derle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Kurulum
        run: pip install build twine

      - name: Derle
        run: python -m build

      - name: Metadata denetimi
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: PyPI'a yükle
    needs: build
    runs-on: ubuntu-latest

    # PyPI'daki "trusted publisher" kaydıyla aynı environment adı olmalı.
    environment: pypi

    # Token yerine kısa ömürlü OIDC kimliği kullanılıyor; depoda sır tutulmuyor.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Aynı sürüm zaten yayındaysa hata vermek yerine atlanır.
          skip-existing: true
