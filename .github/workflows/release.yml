name: Yayın

# Sürüm etiketi push edilince derleme ve metadata denetimi çalışır:
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
# Yükleme adımı elle tetiklenir (Actions -> Yayın -> Run workflow); PyPI tarafında
# "trusted publisher" kaydı yapılmadan çalışmaz ve zaten yayınlanmış bir sürümü
# etiketlemek yüklemeyi tekrar denememeli.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: derle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Kurulum
        run: pip install build twine

      - name: Derle
        run: python -m build

      - name: Metadata denetimi
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: PyPI'a yükle
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # PyPI'daki "trusted publisher" kaydıyla aynı environment adı olmalı.
    environment: pypi

    # Token yerine kısa ömürlü OIDC kimliği kullanılıyor; depoda sır tutulmuyor.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Aynı sürüm zaten yayındaysa hata vermek yerine atlanır.
          skip-existing: true
